<script>
const canvas=document.getElementById("shader");
const gl=canvas.getContext("webgl");
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;gl.viewport(0,0,canvas.width,canvas.height);}
resize();onresize=resize;

const v=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const f=`precision highp float;uniform float t;uniform vec2 r;
void main(){vec2 uv=(gl_FragCoord.xy-.5*r)/r.y;
float d=length(uv);float w=sin(d*12.-t*4.);
float g=.015/abs(w);gl_FragColor=vec4(0.,g*.85,g,1.);}`;

function sh(t,s){let x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);return x;}
const p=gl.createProgram();
gl.attachShader(p,sh(gl.VERTEX_SHADER,v));
gl.attachShader(p,sh(gl.FRAGMENT_SHADER,f));
gl.linkProgram(p);gl.useProgram(p);

const b=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,b);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);

const l=gl.getAttribLocation(p,"p");
gl.enableVertexAttribArray(l);
gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);

const tL=gl.getUniformLocation(p,"t");
const rL=gl.getUniformLocation(p,"r");

function d(ms){
gl.uniform1f(tL,ms*.001);
gl.uniform2f(rL,canvas.width,canvas.height);
gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
requestAnimationFrame(d);
}
d(0);
