/* Scroll Distortion Layer */

position:fixed;

/* Floating Circles */

100%{transform:translateY(0) scale(1);}

<!-- FX ENGINE: Shader + Audio Pulse + Distortion -->
<script>
/* ======================================================
   ADVANCED SHADER
====================================================== */
const canvas = document.getElementById("shader");
const gl = canvas.getContext("webgl");

function resize(){
canvas.width=innerWidth;
canvas.height=innerHeight;
gl.viewport(0,0,canvas.width,canvas.height);
}
resize(); onresize=resize;

const vertex = `
attribute vec2 p;
void main(){ gl_Position = vec4(p,0.,1.); }
`;

const fragment = `
precision highp float;
uniform float t;
uniform vec2 r;

void main(){
vec2 uv = (gl_FragCoord.xy - 0.5*r) / r.y;
float d = length(uv);
float wave = sin(d*12.0 - t*4.0);
float glow = 0.015 / abs(wave);
vec3 col = vec3(0.0, glow*0.8, glow);
gl_FragColor = vec4(col,1.0);
}
`;

function shader(type,src){
const s = gl.createShader(type);
gl.shaderSource(s,src);
gl.compileShader(s);
return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, vertex));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, fragment));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);

const loc = gl.getAttribLocation(prog,"p");
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

const time = gl.getUniformLocation(prog,"t");
const res = gl.getUniformLocation(prog,"r");

function draw(ms){
gl.uniform1f(time, ms*0.001);
gl.uniform2f(res, canvas.width, canvas.height);
gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
requestAnimationFrame(draw);
}
draw(0);

/* ======================================================
   AUDIO REACTIVE BUTTON
====================================================== */
let audio, analyser, dataArray;

async function setupAudio(){
try{
audio = await navigator.mediaDevices.getUserMedia({audio:true});
const ctx = new AudioContext();
const src = ctx.createMediaStreamSource(audio);
analyser = ctx.createAnalyser();
src.connect(analyser);

dataArray = new Uint8Array(analyser.frequencyBinCount);
}catch(e){
console.log("mic blocked");
}
}

setupAudio();

const pulseBtn = document.getElementById("pulseBtn");

function audioPulse(){
if(!analyser) return;
analyser.getByteFrequencyData(dataArray);
let avg = dataArray.reduce((a,b)=>a+b) / dataArray.length;

if(avg > 120) pulseBtn.classList.add("pulse");
else pulseBtn.classList.remove("pulse");

requestAnimationFrame(audioPulse);
}
audioPulse();

/* ======================================================
   SCROLL DISTORTION
====================================================== */
const distort = document.getElementById("distort");
const ctx2 = distort.getContext("2d");
distort.width = innerWidth;
distort.height = innerHeight;

let scrollY = 0;

window.addEventListener("scroll", ()=>{
  scrollY = window.scrollY;
});

function drawDistort(){
ctx2.clearRect(0,0,distort.width,distort.height);
ctx2.fillStyle = `rgba(0,255,200,${0.03 + (scrollY*0.0005)})`;
ctx2.beginPath();
ctx2.arc(innerWidth/2, innerHeight/2, 200 + scrollY*0.3, 0, Math.PI*2);
ctx2.fill();

requestAnimationFrame(drawDistort);
}
drawDistort();
</script>
