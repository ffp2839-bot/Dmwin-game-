<!DOCTYPE html>  
<html lang="en">  
<head>  
<meta charset="UTF-8">  
<title>DMWIN – Intelligent Gaming Platform</title>  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">  

<style>  
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;}  
body{overflow-x:hidden;color:#003366;background:#eef7ff;}  

/* ===== BACKGROUND ===== */  
#bg{  
position:fixed;inset:0;z-index:-3;  
background:linear-gradient(180deg,#eef7ff 0%,#d5ecff 40%,#bfe2ff 70%,#a6d8ff 100%);  
animation:bgMove 10s infinite alternate ease-in-out;  
}  
@keyframes bgMove{  
0%{transform:scale(1);}  
100%{transform:scale(1.25) translateY(40px);}  
}  

/* ===== MENU BUTTON ===== */  
.menu-btn{  
position:fixed;top:20px;right:20px;  
font-size:32px;color:#0066cc;cursor:pointer;z-index:30;  
}  

/* ===== MENU ===== */  
.menu-box{  
position:fixed;top:0;right:-260px;  
width:230px;height:100vh;  
background:rgba(255,255,255,.85);  
backdrop-filter:blur(10px);  
padding:60px 20px;  
border-left:2px solid #cce6ff;  
transition:.4s;z-index:25;  
}  
.menu-box.open{right:0;}  

.menu-box a{  
display:block;margin:15px 0;padding:12px 15px;  
border-radius:12px;text-decoration:none;  
background:rgba(255,255,255,.45);  
color:#003d7a;font-weight:600;  
opacity:0;transform:translateX(40px);  
}  

.menu-box.open a{  
animation:slideIn .45s forwards;  
}  

.menu-box.open a:nth-child(1){animation-delay:.1s;}  
.menu-box.open a:nth-child(2){animation-delay:.2s;}  
.menu-box.open a:nth-child(3){animation-delay:.3s;}  
.menu-box.open a:nth-child(4){animation-delay:.4s;}  
.menu-box.open a:nth-child(5){animation-delay:.5s;}  
.menu-box.open a:nth-child(6){animation-delay:.6s;}  
.menu-box.open a:nth-child(7){animation-delay:.7s;}  

@keyframes slideIn{  
to{opacity:1;transform:translateX(0);}  
}  

/* ===== HERO ===== */  
.hero{  
min-height:100vh;  
display:flex;flex-direction:column;  
justify-content:center;align-items:center;  
text-align:center;padding:0 10%;  
}  

.hero h1{  
font-size:54px;  
background:linear-gradient(90deg,#007bff,#00a8ff);  
-webkit-background-clip:text;color:transparent;  
}  

.hero p{margin-top:10px;font-size:18px;}  

.buttons{margin-top:30px;display:flex;gap:16px;flex-wrap:wrap;}  
.btn{  
padding:14px 28px;border-radius:30px;  
background:#007bff;color:#fff;text-decoration:none;  
font-weight:600;transition:.25s;  
}  
.btn:hover{background:#005fcc;transform:scale(1.05);}  

/* ===== SHORTCUTS ===== */  
.shortcuts{  
margin-top:60px;padding:60px 8%;  
background:#ffffffaa;border-radius:20px;  
backdrop-filter:blur(6px);  
}  
.shortcuts h2{text-align:center;margin-bottom:20px;}  

.shortcut-buttons{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}  
.shortcut-buttons a{  
padding:12px 22px;border-radius:25px;  
background:#e6f2ff;border:1px solid #b3d7ff;  
color:#0059b3;text-decoration:none;font-weight:600;  
}  

/* ===== CONTACT ===== */  
.contact{  
margin-top:80px;padding:40px 8%;  
background:#ffffffaa;border-radius:20px;  
backdrop-filter:blur(6px);  
}  
.contact h2{text-align:center;margin-bottom:20px;}  

.contact input,.contact textarea{  
width:100%;padding:14px;margin:10px 0;  
border-radius:10px;border:1px solid #bcd9ff;font-size:16px;  
}  
.contact textarea{height:100px;resize:none;}  

.contact button{  
padding:14px 24px;border:none;border-radius:30px;  
background:#007bff;color:#fff;font-size:17px;font-weight:600;  
cursor:pointer;  
}  
</style>  
</head>  

<body>  

<div id="bg"></div>  

<!-- MENU BUTTON -->  
<div class="menu-btn" onclick="toggleMenu()">☰</div>  

<!-- MENU -->  
<div class="menu-box" id="menuBox">  
  <a href="index.html">Home</a>  
  <a href="about.html">About</a>  
  <a href="games.html">Games</a>  
  <a href="how-to-play.html">How to Play</a>  
  <a href="bonuses.html">Bonuses</a>  
  <a href="payments.html">Payments</a>  
  <a href="hack.html">Hack</a>  
</div>  

<!-- HERO -->  
<section class="hero">  
  <h1>DMWIN</h1>  
  <p>India’s Most Reliable Gaming Platform with Instant Withdrawals</p>  

  <div class="buttons">  
    <a class="btn" href="https://www.dmwin15.com/#/register?invitationCode=583522131503" target="_blank">Register</a>  
    <a class="btn" href="https://t.me/dmwinpredictionguru" target="_blank">Join Telegram</a>  
  </div>  

  <!-- SHORTCUTS -->  
  <div class="shortcuts">  
    <h2>Explore More</h2>  
    <div class="shortcut-buttons">  
      <a href="about.html">About</a>  
      <a href="games.html">Games</a>  
      <a href="how-to-play.html">How to Play</a>  
      <a href="bonuses.html">Bonuses</a>  
      <a href="payments.html">Payments</a>  
      <a href="hack.html">Hack</a>  
    </div>  
  </div>  

  <!-- CONTACT -->  
  <div class="contact">  
    <h2>Get In Touch</h2>  

    <form id="contactForm" action="https://formspree.io/f/xpqznrqq" method="POST">  
      <input type="text" name="name" placeholder="Your Name" required>  

      <div style="display:flex;gap:8px;">  
        <input type="text" value="+91" disabled style="width:70px;background:#e8f2ff;text-align:center;font-weight:600;">  
        <input type="tel" id="phone" name="phone" placeholder="Phone Number" maxlength="10" required  
        oninput="this.value=this.value.replace(/[^0-9]/g,'');">  
      </div>  

      <input type="email" name="email" placeholder="Email ID" required>  
      <textarea name="message" placeholder="Your Message (optional)"></textarea>  
      <button type="submit">Submit</button>  
    </form>  
  </div>  
</section>  

<script>  
function toggleMenu(){  
 document.getElementById("menuBox").classList.toggle("open");  
}  

document.getElementById("contactForm").addEventListener("submit",function(e){  
 let phone=document.getElementById("phone").value.trim();  
 if(phone.length!==10){  
  alert("Enter valid 10 digit number");

 }

</script>  

</body>  
</html>
