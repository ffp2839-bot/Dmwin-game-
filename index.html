<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;}
body{overflow-x:hidden;background:#eef7ff;color:#003366;}
#bg{position:fixed;inset:0;z-index:-3;background:linear-gradient(180deg,#eef7ff,#d5ecff,#bfe2ff,#a6d8ff);animation:bgMove 12s infinite alternate ease-in-out;}
@keyframes bgMove{0%{transform:scale(1);}100%{transform:scale(1.15) translateY(40px);}}
.menu-btn{position:fixed;top:22px;right:22px;font-size:34px;color:#0066cc;cursor:pointer;z-index:50;}
.menu-box{position:fixed;top:0;right:-260px;width:240px;height:100vh;background:#ffffffdd;backdrop-filter:blur(10px);padding:70px 20px;border-left:2px solid #cce6ff;transition:.4s;z-index:40;}
.menu-box.open{right:0;}
.menu-box a{display:block;margin:12px 0;padding:12px 15px;background:#f2f6ff;border-radius:12px;text-decoration:none;color:#003d7a;font-weight:600;opacity:0;transform:translateX(40px);animation:fadeIn .5s forwards;}
.menu-box.open a:nth-child(1){animation-delay:.1s;}
.menu-box.open a:nth-child(2){animation-delay:.2s;}
.menu-box.open a:nth-child(3){animation-delay:.3s;}
.menu-box.open a:nth-child(4){animation-delay:.4s;}
.menu-box.open a:nth-child(5){animation-delay:.5s;}
.menu-box.open a:nth-child(6){animation-delay:.6s;}
.menu-box.open a:nth-child(7){animation-delay:.7s;}
@keyframes fadeIn{to{opacity:1;transform:translateX(0);}}

.hero{padding:140px 10% 80px;text-align:center;}
.hero h1{font-size:62px;font-weight:700;background:linear-gradient(90deg,#007bff,#00a8ff);-webkit-background-clip:text;color:transparent;}
.hero p{margin-top:12px;font-size:22px;color:#003d7a;font-weight:500;}
.buttons{margin-top:32px;display:flex;gap:18px;justify-content:center;flex-wrap:wrap;}
.btn{padding:16px 34px;color:#fff;background:#007bff;border-radius:32px;text-decoration:none;font-weight:600;font-size:17px;transition:.25s;}
.btn:hover{background:#005fcc;transform:scale(1.06);}
.info-cards{margin-top:60px;display:flex;flex-wrap:wrap;gap:24px;justify-content:center;}
.card{width:300px;padding:24px;border-radius:20px;background:#ffffffee;border:1px solid #cfe2ff;backdrop-filter:blur(6px);text-align:center;}
.card h3{font-size:24px;color:#005bbb;margin-bottom:10px;}
.card p{font-size:17px;color:#003d7a;}
.features{margin-top:80px;padding:60px 8%;background:#ffffffcc;border-radius:20px;backdrop-filter:blur(6px);}
.features h2{font-size:36px;text-align:center;margin-bottom:30px;}
.feature-grid{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;}
.feature-box{width:280px;background:#e9f3ff;padding:22px;border:1px solid #c6dbff;border-radius:15px;}
.feature-box h4{font-size:22px;margin-bottom:10px;color:#0059b3;}
.feature-box p{font-size:17px;}
.testimonials{margin-top:80px;padding:50px 8%;background:#ffffffbb;border-radius:20px;text-align:center;backdrop-filter:blur(6px);}
.testimonials h2{font-size:34px;margin-bottom:20px;}
.slider{max-width:650px;margin:auto;position:relative;}
.review{opacity:0;transform:translateX(40px);transition:.6s;background:#fff;padding:24px;border-radius:16px;border:1px solid #d0e4ff;}
.review.active{opacity:1;transform:translateX(0);}
.review p{font-size:18px;font-style:italic;color:#003366;margin-bottom:8px;line-height:1.5;}
.review strong{font-size:16px;color:#005bbb;}
.stars{color:#ffb400;margin-top:6px;font-size:20px;}
.contact{margin-top:90px;padding:50px 8%;background:#ffffffee;border-radius:22px;max-width:850px;margin:auto;border:1px solid #d7e8ff;box-shadow:0 4px 25px rgba(0,0,0,0.08);}
.contact h2{font-size:36px;margin-bottom:25px;text-align:center;}
.contact input,.contact textarea{width:100%;padding:18px;font-size:18px;border-radius:14px;border:2px solid #d9e8ff;margin:12px 0;}
.contact textarea{height:120px;resize:none;}
.contact button{margin-top:10px;width:100%;padding:18px;font-size:20px;font-weight:600;border-radius:14px;border:none;background:#007bff;color:white;cursor:pointer;}
</style>
