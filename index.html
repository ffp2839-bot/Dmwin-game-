<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DMWIN – Smarter Gaming Platform</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;}
body{background:#000;color:#fff;overflow-x:hidden;}

/* NEW SMOOTH NEON BACKGROUND */
#bg{
position:fixed;
inset:0;
z-index:-3;
background:radial-gradient(circle at 30% 30%, #00ffcc33, #001b1a),
            radial-gradient(circle at 70% 70%, #00d9ff33, #001b1a);
animation:bgMove 8s infinite alternate ease-in-out;
filter:blur(40px);
}
@keyframes bgMove{
0%{transform:scale(1) translate(0,0);}
100%{transform:scale(1.3) translate(30px,40px);}
}

/* TOP RIGHT MENU */
.menu-btn{
position:fixed;
top:20px; right:20px;
font-size:32px;
cursor:pointer;
z-index:20;
color:#00ffe6;
user-select:none;
transition:.3s;
}
.menu-btn:hover{color:#00ff99;}

.menu-box{
position:fixed;
top:0; right:-260px;
width:240px; height:100vh;
background:rgba(0,0,0,0.65);
backdrop-filter:blur(10px);
padding:40px 20px;
transition:.4s;
z-index:19;
}
.menu-box.open{right:0;}

.menu-box a{
display:block;
margin:15px 0;
color:#fff;
text-decoration:none;
font-weight:600;
padding:10px 15px;
border-radius:10px;
background:rgba(255,255,255,0.08);
transition:.3s;
}
.menu-box a:hover{background:rgba(255,255,255,0.2);}

/* HERO */
.hero{
min-height:100vh;
display:flex;flex-direction:column;
justify-content:center;align-items:center;
text-align:center;padding:0 8%;
}
h1{
font-size:54px;
font-weight:700;
background:linear-gradient(90deg,#00f7ff,#00ff88);
-webkit-background-clip:text;
color:transparent;
}
p{margin-top:18px;font-size:18px;color:#c8dcff;}

/* BUTTONS */
.buttons{
margin-top:40px;display:flex;gap:18px;flex-wrap:wrap;justify-content:center;
}
.btn{
padding:16px 32px;
border-radius:40px;
text-decoration:none;
font-weight:700;
background:linear-gradient(135deg,#00eaff,#00ff6f);
color:#000;
box-shadow:0 0 20px rgba(0,255,150,0.4);
transition:.2s;
}
.btn:hover{transform:scale(1.05);} 

/* PAGE SHORTCUTS SECTION */
.shortcuts{
padding:70px 8% 90px;
text-align:center;
}
.shortcuts h2{
font-size:32px;
background:linear-gradient(90deg,#00f7ff,#00ff88);
-webkit-background-clip:text;
color:transparent;
margin-bottom:30px;
}
.shortcut-buttons{
display:flex;flex-wrap:wrap;gap:16px;justify-content:center;
}
.shortcut-buttons a{
padding:14px 26px;
border-radius:30px;
background:#111;
border:1px solid #00ffb3;
text-decoration:none;
color:#00ffb3;
font-weight:600;
transition:.25s;
}
.shortcut-buttons a:hover{
background:#00ffb3;
color:#000;
}
</style>
</head>

<body>

<!-- Neon Moving Background -->
<div id="bg"></div>

<!-- MENU BUTTON -->
<div class="menu-btn" onclick="toggleMenu()">☰</div>

<!-- SLIDE MENU -->
<div class="menu-box" id="menuBox">
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
  <a href="games.html">Games</a>

  <a href="bonuses.html">Bonuses</a>
  <a href="payments.html">Payments</a>
  <a href="hack.html">Hack Service</a>
</div>

<!-- HERO -->
<section class="hero">
  <h1>DMWIN</h1>
  <p>
    Intelligent Gaming Platform with Instant Withdrawals,<br>
    Multiple Games and Premium Experience.
  </p>

  <div class="buttons">
    <a class="btn" href="https://www.dmwin15.com/#/register?invitationCode=583522131503" target="_blank">Register Now</a>
    <a class="btn" href="https://t.me/dmwinpredictionguru" target="_blank">Join Telegram Channel</a>
  </div>
</section>

<!-- PAGE SHORTCUTS -->
<section class="shortcuts">
  <h2>Explore More</h2>
  <div class="shortcut-buttons">
    <a href="about.html">About</a>
    <a href="games.html">Games</a>
    <a href="how-to-play.html">How to Play</a>
    <a href="bonuses.html">Bonuses</a>
    <a href="payments.html">Payments</a>
    <a href="hack.html">Hack Service</a>
  </div>
</section>

<script>
function toggleMenu(){
document.getElementById("menuBox").classList.toggle("open");
}
</script>

</body>
  </html>
